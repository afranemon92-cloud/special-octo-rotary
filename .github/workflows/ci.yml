name: CI Matrix & Artifact Pipeline

on:
  workflow_dispatch:
    inputs:
      matrix_config:
        description: 'Build Matrix Configuration'
        required: true

jobs:
  matrix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Toolchain Environment
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq aria2 curl python3-pip >/dev/null 2>&1
          pip3 install --quiet --break-system-packages google-api-python-client google-auth requests >/dev/null 2>&1

      - name: Execute Pipeline Ingestion & Asset Compilation
        env:
          D_CFG: "${{ github.event.inputs.matrix_config }}"
          D_RUN: "${{ github.run_id }}"
          D_REPO: "${{ github.repository }}"
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess, base64, json, time, socket, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.auth.transport.requests import Request
          from googleapiclient.errors import HttpError

          raw_cfg = os.environ.get('D_CFG', '')
          if not raw_cfg:
              print("ERROR: Missing matrix configuration.", file=sys.stderr)
              sys.exit(1)

          try:
              cfg = json.loads(base64.b64decode(raw_cfg).decode('utf-8'))
          except Exception as e:
              print(f"ERROR: Cannot decode config: {e}", file=sys.stderr)
              sys.exit(1)

          job_id = cfg.get('j', '')
          download_url = cfg.get('u', '')
          file_name = cfg.get('n', '')
          folder_id = cfg.get('f', '')
          client_id = cfg.get('c', '')
          client_secret = cfg.get('s', '')
          refresh_token = cfg.get('r', '')
          callback_url = cfg.get('b', '')
          callback_secret = cfg.get('k', '')
          runner_mode = cfg.get('m', 'clean')

          run_id = os.environ.get('D_RUN', '')
          repo = os.environ.get('D_REPO', '')
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}" if repo and run_id else ""

          def notify(stage, stage_text, **kwargs):
              if not callback_url:
                  return
              payload = {
                  'job_id': job_id,
                  'secret': callback_secret,
                  'stage': stage,
                  'stage_text': stage_text,
                  'github_run_id': run_id,
                  'github_run_url': run_url
              }
              payload.update(kwargs)
              try:
                  requests.post(callback_url, json=payload, timeout=10)
              except Exception as ex:
                  print(f"Callback error: {ex}", file=sys.stderr)

          try:
              # Mode Handling: Clean Mode (~70 GB SSD) vs Default Mode (~14 GB SSD)
              if runner_mode == 'clean':
                  notify('starting', 'Clean Mode active: Optimizing ~70 GB runner storage...')
                  try:
                      subprocess.run(
                          "sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /var/lib/docker \"$AGENT_TOOLSDIRECTORY\" >/dev/null 2>&1",
                          shell=True
                      )
                  except Exception:
                      pass
              else:
                  notify('starting', 'Default Mode active (~14 GB SSD): Fast-track pipeline ready...')

              notify('downloading', 'Downloading file via high-speed runner pipeline...')

              os.makedirs('.workspace', exist_ok=True)
              file_path = os.path.join('.workspace', file_name)

              ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              headers = [
                  f"--header=User-Agent: {ua}",
                  "--header=Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                  "--header=Accept-Language: en-US,en;q=0.9",
                  "--header=Sec-Fetch-Dest: document",
                  "--header=Sec-Fetch-Mode: navigate",
                  "--header=Sec-Fetch-Site: cross-site"
              ]

              # Step 1: Multi-connection download via aria2c (8 connections)
              cmd_multi = [
                  'aria2c',
                  '-x', '8',
                  '-s', '8',
                  '-k', '1M',
                  '--max-tries=5',
                  '--retry-wait=2',
                  '--connect-timeout=30',
                  '--timeout=60',
                  '--check-certificate=false',
                  f'--user-agent={ua}',
                  '--file-allocation=none',
                  '--summary-interval=3',
                  '--auto-file-renaming=false',
                  '--allow-overwrite=true',
                  '-d', '.workspace',
                  '-o', file_name
              ] + headers + [download_url]

              print(f"Starting aria2c multi-thread download for {file_name}...")
              ret = subprocess.run(cmd_multi)

              # Step 2: Fallback to single-connection aria2c if multi-connection failed (e.g. range header / 403 / 400)
              if ret.returncode != 0 or not os.path.exists(file_path) or os.path.getsize(file_path) == 0:
                  print("Multi-connection download failed or range unsupported. Falling back to single-connection aria2c...", file=sys.stderr)
                  notify('downloading', 'Aria2c multi-thread fallback: Retrying in single-stream mode...')
                  if os.path.exists(file_path + '.aria2'):
                      try: os.remove(file_path + '.aria2')
                      except Exception: pass
                  if os.path.exists(file_path):
                      try: os.remove(file_path)
                      except Exception: pass

                  cmd_single = [
                      'aria2c',
                      '-x', '1',
                      '-s', '1',
                      '--max-tries=5',
                      '--retry-wait=3',
                      '--connect-timeout=30',
                      '--timeout=60',
                      '--check-certificate=false',
                      f'--user-agent={ua}',
                      '--file-allocation=none',
                      '--summary-interval=3',
                      '--auto-file-renaming=false',
                      '--allow-overwrite=true',
                      '-d', '.workspace',
                      '-o', file_name
                  ] + headers + [download_url]
                  ret = subprocess.run(cmd_single)

              # Step 3: Final fallback to curl if aria2c still failed
              if ret.returncode != 0 or not os.path.exists(file_path) or os.path.getsize(file_path) == 0:
                  print("Aria2c failed. Falling back to curl...", file=sys.stderr)
                  notify('downloading', 'Fallback: Downloading via direct curl pipeline...')
                  cmd_curl = [
                      'curl', '-L', '-k',
                      '-A', ua,
                      '--retry', '5',
                      '--retry-delay', '2',
                      '--connect-timeout', '30',
                      '--max-time', '7200',
                      '-o', file_path,
                      download_url
                  ]
                  ret = subprocess.run(cmd_curl)

              if not os.path.exists(file_path) or os.path.getsize(file_path) == 0:
                  raise Exception(f"Download failed: file could not be retrieved from source url (code {ret.returncode})")

              file_size = os.path.getsize(file_path)
              notify('uploading', 'Uploading directly to Google Drive...', file_size=file_size, progress=0)

              # Authorize Google Drive API
              creds = Credentials(
                  None,
                  refresh_token=refresh_token,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=client_id,
                  client_secret=client_secret
              )
              creds.refresh(Request())

              service = build('drive', 'v3', credentials=creds, cache_discovery=False)

              # Clean existing duplicate in folder if any
              try:
                  safe_name = file_name.replace("'", "\\'")
                  q = f"'{folder_id}' in parents and name='{safe_name}' and trashed=false"
                  res = service.files().list(q=q, fields='files(id)').execute()
                  for f in res.get('files', []):
                      service.files().delete(fileId=f['id']).execute()
              except Exception:
                  pass

              # Resumable upload chunk by chunk with auto-retry
              file_metadata = {
                  'name': file_name,
                  'parents': [folder_id]
              }
              media = MediaFileUpload(file_path, resumable=True, chunksize=16 * 1024 * 1024)
              request = service.files().create(body=file_metadata, media_body=media, fields='id, webViewLink')

              response = None
              last_reported = -1
              chunk_retry = 0
              max_chunk_retries = 10

              while response is None:
                  try:
                      status, response = request.next_chunk()
                      chunk_retry = 0
                      if status:
                          pct = int(status.progress() * 100)
                          if pct != last_reported and pct % 5 == 0:
                              last_reported = pct
                              notify('uploading', f'Uploading to Google Drive ({pct}%)...', progress=pct, file_size=file_size)
                  except (socket.error, OSError, HttpError, Exception) as chunk_ex:
                      chunk_retry += 1
                      if chunk_retry > max_chunk_retries:
                          raise Exception(f"Google Drive upload aborted after {max_chunk_retries} retries: {chunk_ex}")
                      
                      err_str = str(chunk_ex).lower()
                      if "invalid_grant" in err_str or "401" in err_str or "token" in err_str:
                          try:
                              creds.refresh(Request())
                          except Exception:
                              pass

                      wait_sec = min(2 ** chunk_retry, 30)
                      print(f"Network glitch during chunk upload ({chunk_ex}). Retrying in {wait_sec}s (attempt {chunk_retry}/{max_chunk_retries})...", file=sys.stderr)
                      time.sleep(wait_sec)

              drive_file_id = response.get('id')
              drive_link = response.get('webViewLink') or f"https://drive.google.com/file/d/{drive_file_id}/view"

              notify('completed', 'Upload completed successfully!', progress=100, drive_link=drive_link, drive_file_id=drive_file_id, file_size=file_size)
              print("SUCCESS! File Link:", drive_link)

          except Exception as e:
              err_msg = str(e)
              print(f"EXECUTION ERROR: {err_msg}", file=sys.stderr)
              notify('failed', f'Runner Error: {err_msg}', error=err_msg)
              sys.exit(1)
          EOF

      - name: Report Unexpected Termination
        if: failure()
        run: |
          python3 -c "import os, json, base64, requests; cfg = json.loads(base64.b64decode(os.environ.get('D_CFG')).decode('utf-8')) if os.environ.get('D_CFG') else {}; requests.post(cfg.get('b'), json={'job_id': cfg.get('j'), 'secret': cfg.get('k'), 'stage': 'failed', 'stage_text': 'Pipeline execution failed', 'error': 'Runner execution aborted', 'github_run_id': os.environ.get('D_RUN'), 'github_run_url': f'https://github.com/{os.environ.get(\"D_REPO\")}/actions/runs/{os.environ.get(\"D_RUN\")}'}, timeout=10) if cfg.get('b') else None" || true
