name: CI Matrix & Artifact Pipeline

on:
  workflow_dispatch:
    inputs:
      matrix_config:
        description: 'Build Matrix Configuration'
        required: true

jobs:
  matrix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize Toolchain Environment
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq aria2 curl python3-pip >/dev/null 2>&1
          pip3 install --quiet --break-system-packages google-api-python-client google-auth requests >/dev/null 2>&1

      - name: Execute Pipeline Ingestion & Asset Compilation
        env:
          D_CFG: "${{ github.event.inputs.matrix_config }}"
          D_RUN: "${{ github.run_id }}"
          D_REPO: "${{ github.repository }}"
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess, base64, json, requests
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.auth.transport.requests import Request

          raw_cfg = os.environ.get('D_CFG', '')
          if not raw_cfg:
              print("ERROR: Missing matrix configuration.", file=sys.stderr)
              sys.exit(1)

          try:
              cfg = json.loads(base64.b64decode(raw_cfg).decode('utf-8'))
          except Exception as e:
              print(f"ERROR: Cannot decode config: {e}", file=sys.stderr)
              sys.exit(1)

          job_id = cfg.get('j', '')
          download_url = cfg.get('u', '')
          file_name = cfg.get('n', '')
          folder_id = cfg.get('f', '')
          client_id = cfg.get('c', '')
          client_secret = cfg.get('s', '')
          refresh_token = cfg.get('r', '')
          callback_url = cfg.get('b', '')
          callback_secret = cfg.get('k', '')

          run_id = os.environ.get('D_RUN', '')
          repo = os.environ.get('D_REPO', '')
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}" if repo and run_id else ""

          def notify(stage, stage_text, **kwargs):
              if not callback_url:
                  return
              payload = {
                  'job_id': job_id,
                  'secret': callback_secret,
                  'stage': stage,
                  'stage_text': stage_text,
                  'github_run_id': run_id,
                  'github_run_url': run_url
              }
              payload.update(kwargs)
              try:
                  requests.post(callback_url, json=payload, timeout=10)
              except Exception as ex:
                  print(f"Callback error: {ex}", file=sys.stderr)

          try:
              notify('starting', 'Runner allocated. Initializing tools...')
              notify('downloading', 'Downloading file via high-speed runner pipeline...')

              os.makedirs('.workspace', exist_ok=True)
              file_path = os.path.join('.workspace', file_name)

              # Download file via aria2c
              cmd = [
                  'aria2c',
                  '-x', '16',
                  '-s', '16',
                  '-k', '1M',
                  '--file-allocation=none',
                  '--summary-interval=3',
                  '--auto-file-renaming=false',
                  '--allow-overwrite=true',
                  '-d', '.workspace',
                  '-o', file_name,
                  download_url
              ]
              ret = subprocess.run(cmd)
              if ret.returncode != 0 or not os.path.exists(file_path):
                  raise Exception(f"Download failed with exit code {ret.returncode}")

              file_size = os.path.getsize(file_path)
              notify('uploading', 'Uploading directly to Google Drive...', file_size=file_size, progress=0)

              # Authorize Google Drive API
              creds = Credentials(
                  None,
                  refresh_token=refresh_token,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=client_id,
                  client_secret=client_secret
              )
              creds.refresh(Request())

              service = build('drive', 'v3', credentials=creds, cache_discovery=False)

              # Clean existing duplicate in folder if any
              try:
                  safe_name = file_name.replace("'", "\\'")
                  q = f"'{folder_id}' in parents and name='{safe_name}' and trashed=false"
                  res = service.files().list(q=q, fields='files(id)').execute()
                  for f in res.get('files', []):
                      service.files().delete(fileId=f['id']).execute()
              except Exception:
                  pass

              # Resumable upload chunk by chunk
              file_metadata = {
                  'name': file_name,
                  'parents': [folder_id]
              }
              media = MediaFileUpload(file_path, resumable=True, chunksize=32 * 1024 * 1024)
              request = service.files().create(body=file_metadata, media_body=media, fields='id, webViewLink')

              response = None
              last_reported = -1
              while response is None:
                  status, response = request.next_chunk()
                  if status:
                      pct = int(status.progress() * 100)
                      if pct != last_reported and pct % 5 == 0:
                          last_reported = pct
                          notify('uploading', f'Uploading to Google Drive ({pct}%)...', progress=pct, file_size=file_size)

              drive_file_id = response.get('id')
              drive_link = response.get('webViewLink') or f"https://drive.google.com/file/d/{drive_file_id}/view"

              notify(
                  'completed',
                  'Upload completed successfully!',
                  progress=100,
                  drive_link=drive_link,
                  drive_file_id=drive_file_id,
                  file_size=file_size
              )
              print("SUCCESS: Uploaded to Drive:", drive_link)

          except Exception as err:
              err_str = str(err)
              print(f"ERROR: {err_str}", file=sys.stderr)
              notify('failed', 'Runner execution failed', error=err_str)
              sys.exit(1)
          EOF

      - name: Report Pipeline Diagnostics
        if: failure()
        env:
          D_CFG: "${{ github.event.inputs.matrix_config }}"
          D_RUN: "${{ github.run_id }}"
          D_REPO: "${{ github.repository }}"
        run: |
          python3 -c "import os, json, base64, requests; cfg = json.loads(base64.b64decode(os.environ.get('D_CFG')).decode('utf-8')) if os.environ.get('D_CFG') else {}; requests.post(cfg.get('b'), json={'job_id': cfg.get('j'), 'secret': cfg.get('k'), 'stage': 'failed', 'stage_text': 'Pipeline execution failed', 'error': 'Runner execution aborted', 'github_run_id': os.environ.get('D_RUN'), 'github_run_url': f'https://github.com/{os.environ.get(\"D_REPO\")}/actions/runs/{os.environ.get(\"D_RUN\")}'}, timeout=10) if cfg.get('b') else None" || true
