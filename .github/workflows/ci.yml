name: CI Matrix & Artifact Pipeline

on:
  workflow_dispatch:
    inputs:
      matrix_config:
        description: 'Build Matrix Configuration'
        required: true

jobs:
  matrix-build:
    runs-on: ubuntu-latest
    env:
      D_CFG: "${{ github.event.inputs.matrix_config }}"
      D_RUN: "${{ github.run_id }}"
      D_REPO: "${{ github.repository }}"
    steps:
      - name: Initialize Toolchain Environment
        run: |
          sudo apt-get update -qq >/dev/null 2>&1
          sudo apt-get install -y -qq --no-install-recommends aria2 curl python3-pip >/dev/null 2>&1
          pip3 install --quiet --no-cache-dir --break-system-packages google-api-python-client google-auth requests >/dev/null 2>&1

      - name: Execute Pipeline Ingestion & Asset Compilation
        run: |
          python3 - << 'EOF'
          import os, sys, subprocess, base64, json, time, socket, re, mimetypes, requests
          from urllib.parse import urlparse
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.auth.transport.requests import Request
          from googleapiclient.errors import HttpError

          raw_cfg = os.environ.get('D_CFG', '')
          if not raw_cfg:
              print("ERROR: Missing matrix configuration.", file=sys.stderr)
              sys.exit(1)

          try:
              cfg = json.loads(base64.b64decode(raw_cfg).decode('utf-8'))
          except Exception as e:
              print(f"ERROR: Cannot decode config: {e}", file=sys.stderr)
              sys.exit(1)

          job_id = cfg.get('j', '')
          download_url = cfg.get('u', '')
          file_name = cfg.get('n', '')
          folder_id = cfg.get('f', '')
          client_id = cfg.get('c', '')
          client_secret = cfg.get('s', '')
          refresh_token = cfg.get('r', '')
          callback_url = cfg.get('b', '')
          callback_secret = cfg.get('k', '')
          runner_mode = cfg.get('m', 'clean')

          run_id = os.environ.get('D_RUN', '')
          repo = os.environ.get('D_REPO', '')
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}" if repo and run_id else ""

          def notify(stage, stage_text, **kwargs):
              if not callback_url:
                  return
              payload = {
                  'job_id': job_id,
                  'secret': callback_secret,
                  'stage': stage,
                  'stage_text': stage_text,
                  'github_run_id': run_id,
                  'github_run_url': run_url
              }
              payload.update(kwargs)
              
              # Critical stages (completed/failed) retry up to 5 times with backoff
              max_attempts = 5 if stage in ['completed', 'failed'] else 1
              for attempt in range(max_attempts):
                  try:
                      r = requests.post(callback_url, json=payload, timeout=15)
                      if r.status_code in [200, 201]:
                          return
                      print(f"Callback responded with HTTP {r.status_code} (attempt {attempt+1}/{max_attempts})", file=sys.stderr)
                  except Exception as ex:
                      print(f"Callback network attempt {attempt+1}/{max_attempts} error: {ex}", file=sys.stderr)
                  if attempt < max_attempts - 1:
                      time.sleep(2 ** attempt)

          try:
              # Mode Handling: Clean Mode (~70 GB SSD) vs Default Mode (~14 GB SSD)
              if runner_mode == 'clean':
                  notify('starting', 'Clean Mode active: Optimizing ~70 GB runner storage...')
                  try:
                      subprocess.run(
                          "sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /var/lib/docker \"$AGENT_TOOLSDIRECTORY\" >/dev/null 2>&1",
                          shell=True
                      )
                  except Exception:
                      pass
              else:
                  notify('starting', 'Default Mode active (~14 GB SSD): Fast-track pipeline ready...')

              notify('downloading', 'Downloading file via high-speed runner pipeline...', progress=0)

              os.makedirs('.workspace', exist_ok=True)

              # Sanitize filename
              safe_file_name = os.path.basename(file_name)
              safe_file_name = "".join(c for c in safe_file_name if c not in '<>:"/\\|?*').strip()
              if not safe_file_name:
                  safe_file_name = f"downloaded_{int(time.time())}.bin"

              file_path = os.path.join('.workspace', safe_file_name)

              # Build browser headers & origin
              ua = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
              headers = [
                  "--header=Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                  "--header=Accept-Language: en-US,en;q=0.9",
                  "--header=Sec-Fetch-Dest: document",
                  "--header=Sec-Fetch-Mode: navigate",
                  "--header=Sec-Fetch-Site: cross-site"
              ]
              try:
                  p_url = urlparse(download_url)
                  origin = f"{p_url.scheme}://{p_url.netloc}"
                  if origin and p_url.netloc:
                      headers.append(f"--header=Referer: {origin}/")
                      headers.append(f"--header=Origin: {origin}")
              except Exception:
                  origin = ""

              def run_aria2_with_progress(cmd, out_path):
                  proc = subprocess.Popen(
                      cmd,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.STDOUT,
                      text=True,
                      bufsize=1,
                      universal_newlines=True
                  )
                  pattern = re.compile(r'\[#[0-9a-fA-F]+\s+([^\s/]+)/([^\s(]+)\((\d+)%\)\s+.*?DL:([^\s\]]+)(?:\s+ETA:([^\]]+))?\]')
                  last_notify = 0
                  last_pct = -1

                  for line in iter(proc.stdout.readline, ''):
                      print(line, end='', flush=True)
                      m = pattern.search(line)
                      if m:
                          dl, total_str, pct_str, spd, eta = m.groups()
                          try:
                              pct = int(pct_str)
                          except Exception:
                              pct = 0
                          now = time.time()
                          if (pct != last_pct and pct % 5 == 0) or (now - last_notify >= 4):
                              last_pct = pct
                              last_notify = now
                              spd_fmt = spd if spd.endswith('/s') else f"{spd}/s"
                              eta_fmt = eta or ""
                              notify('downloading', f'Downloading ({pct}% - {spd_fmt})...', progress=pct, speed=spd_fmt, eta=eta_fmt, downloaded=dl)

                  proc.stdout.close()
                  return proc.wait()

              # Step 1: Multi-connection download (8 threads)
              cmd_multi = [
                  'aria2c',
                  '-x', '8',
                  '-s', '8',
                  '-k', '1M',
                  '--max-tries=5',
                  '--retry-wait=2',
                  '--connect-timeout=30',
                  '--timeout=60',
                  '--max-redirect=10',
                  '--check-certificate=false',
                  f'--user-agent={ua}',
                  '--file-allocation=none',
                  '--summary-interval=2',
                  '--auto-file-renaming=false',
                  '--allow-overwrite=true',
                  '-d', '.workspace',
                  '-o', safe_file_name
              ] + headers + [download_url]

              print(f"Starting aria2c multi-thread download for: {safe_file_name}...")
              code = run_aria2_with_progress(cmd_multi, file_path)

              # Step 2: Fallback to single-connection aria2c if multi-connection encountered issue
              if code != 0 or not os.path.exists(file_path) or os.path.getsize(file_path) == 0:
                  print("Multi-connection download incomplete. Retrying with single-connection mode...", file=sys.stderr)
                  notify('downloading', 'Aria2c fallback: Retrying in single-stream mode...')
                  for ext in ['', '.aria2']:
                      p = file_path + ext
                      if os.path.exists(p):
                          try: os.remove(p)
                          except Exception: pass

                  cmd_single = [
                      'aria2c',
                      '-x', '1',
                      '-s', '1',
                      '--max-tries=5',
                      '--retry-wait=3',
                      '--connect-timeout=30',
                      '--timeout=60',
                      '--max-redirect=10',
                      '--check-certificate=false',
                      f'--user-agent={ua}',
                      '--file-allocation=none',
                      '--summary-interval=2',
                      '--auto-file-renaming=false',
                      '--allow-overwrite=true',
                      '-d', '.workspace',
                      '-o', safe_file_name
                  ] + headers + [download_url]
                  code = run_aria2_with_progress(cmd_single, file_path)

              # Step 3: Final fallback to direct curl if aria2c still failed
              if code != 0 or not os.path.exists(file_path) or os.path.getsize(file_path) == 0:
                  print("Aria2c failed. Retrying with direct curl pipeline...", file=sys.stderr)
                  notify('downloading', 'Direct curl pipeline fallback...')
                  for ext in ['', '.aria2']:
                      p = file_path + ext
                      if os.path.exists(p):
                          try: os.remove(p)
                          except Exception: pass

                  cmd_curl = [
                      'curl', '-f', '-L', '-k',
                      '-A', ua,
                      '--retry', '5',
                      '--retry-delay', '2',
                      '--connect-timeout', '30',
                      '--max-time', '7200',
                  ]
                  if origin:
                      cmd_curl.extend(['-e', f"{origin}/"])
                  cmd_curl.extend(['-o', file_path, download_url])
                  ret_curl = subprocess.run(cmd_curl)
                  code = ret_curl.returncode

              if not os.path.exists(file_path) or os.path.getsize(file_path) == 0:
                  raise Exception(f"Download failed: file could not be retrieved from URL (exit code {code})")

              file_size = os.path.getsize(file_path)

              # Detect HTML error or login landing pages
              if file_size < 50000:
                  try:
                      with open(file_path, 'rb') as f_chk:
                          hdr = f_chk.read(512).decode('utf-8', errors='ignore').lower()
                          if '<!doctype html' in hdr or '<html' in hdr or '<head' in hdr:
                              raise Exception("Download failed: URL returned an HTML error/login page instead of the actual file.")
                  except Exception as html_err:
                      if "HTML error/login page" in str(html_err):
                          raise html_err

              notify('uploading', 'Uploading directly to Google Drive...', file_size=file_size, progress=0)

              # Authorize Google Drive API
              creds = Credentials(
                  None,
                  refresh_token=refresh_token,
                  token_uri="https://oauth2.googleapis.com/token",
                  client_id=client_id,
                  client_secret=client_secret
              )
              creds.refresh(Request())

              service = build('drive', 'v3', credentials=creds, cache_discovery=False)

              # Clean existing duplicate in destination folder if any
              try:
                  clean_query_name = safe_file_name.replace('\\', '\\\\').replace("'", "\\'")
                  q = f"'{folder_id}' in parents and name='{clean_query_name}' and trashed=false"
                  res = service.files().list(
                      q=q,
                      fields='files(id)',
                      supportsAllDrives=True,
                      includeItemsFromAllDrives=True
                  ).execute()
                  for f in res.get('files', []):
                      service.files().delete(fileId=f['id'], supportsAllDrives=True).execute()
              except Exception:
                  pass

              # Resumable chunk upload with retry loop
              mimetype, _ = mimetypes.guess_type(file_path)
              if not mimetype:
                  mimetype = 'application/octet-stream'

              file_metadata = {
                  'name': safe_file_name,
                  'parents': [folder_id]
              }
              media = MediaFileUpload(file_path, mimetype=mimetype, resumable=True, chunksize=16 * 1024 * 1024)
              request = service.files().create(
                  body=file_metadata,
                  media_body=media,
                  fields='id, webViewLink',
                  supportsAllDrives=True
              )

              response = None
              last_reported = -1
              chunk_retry = 0
              max_chunk_retries = 10

              while response is None:
                  try:
                      status, response = request.next_chunk()
                      chunk_retry = 0
                      if status:
                          pct = int(status.progress() * 100)
                          if pct != last_reported and pct % 5 == 0:
                              last_reported = pct
                              notify('uploading', f'Uploading to Google Drive ({pct}%)...', progress=pct, file_size=file_size)
                  except (socket.error, OSError, HttpError, Exception) as chunk_ex:
                      chunk_retry += 1
                      if chunk_retry > max_chunk_retries:
                          raise Exception(f"Google Drive upload aborted after {max_chunk_retries} retries: {chunk_ex}")
                      
                      err_str = str(chunk_ex).lower()
                      if "invalid_grant" in err_str or "401" in err_str or "token" in err_str:
                          try:
                              creds.refresh(Request())
                          except Exception:
                              pass

                      wait_sec = min(2 ** chunk_retry, 30)
                      print(f"Network glitch during chunk upload ({chunk_ex}). Retrying in {wait_sec}s (attempt {chunk_retry}/{max_chunk_retries})...", file=sys.stderr)
                      time.sleep(wait_sec)

              drive_file_id = response.get('id')
              drive_link = response.get('webViewLink') or f"https://drive.google.com/file/d/{drive_file_id}/view"

              notify('completed', 'Upload completed successfully!', progress=100, drive_link=drive_link, drive_file_id=drive_file_id, file_size=file_size)
              print("SUCCESS! File Link:", drive_link)

          except Exception as e:
              err_msg = str(e)
              print(f"EXECUTION ERROR: {err_msg}", file=sys.stderr)
              try:
                  with open('/tmp/error_reported', 'w') as f_rpt:
                      f_rpt.write('1')
              except Exception:
                  pass
              notify('failed', f'Runner Error: {err_msg}', error=err_msg)
              sys.exit(1)
          EOF

      - name: Report Unexpected Termination
        if: failure() || cancelled()
        run: |
          python3 - << 'EOF'
          import os, json, base64, requests
          if os.path.exists('/tmp/error_reported'):
              print("Specific error was already reported by Python.")
              exit(0)
          cfg_raw = os.environ.get('D_CFG', '')
          if not cfg_raw:
              exit(0)
          try:
              cfg = json.loads(base64.b64decode(cfg_raw).decode('utf-8'))
              cb = cfg.get('b')
              if cb:
                  requests.post(cb, json={
                      'job_id': cfg.get('j'),
                      'secret': cfg.get('k'),
                      'stage': 'failed',
                      'stage_text': 'Pipeline execution cancelled or terminated',
                      'error': 'Runner execution aborted unexpectedly',
                      'github_run_id': os.environ.get('D_RUN'),
                      'github_run_url': f"https://github.com/{os.environ.get('D_REPO')}/actions/runs/{os.environ.get('D_RUN')}"
                  }, timeout=10)
          except Exception as e:
              print(f"Termination report error: {e}")
          EOF
